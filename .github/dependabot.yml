version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    # NOTE (2026-10-14): the former `ignore: [github/codeql-action]` HOLD is
    # removed. It was versions-scoped, so a SHA-form re-bump bypassed it and
    # produced PR #98 anyway (the nexia-list#101/#104 failure mode), while
    # giving a false sense that CodeQL was held. CodeQL is now SHA-pinned to
    # v4.38.3 (24c5418), which verified green on PR #98. Do not re-add a
    # bare ignore without a versions constraint; a hold that Dependabot can
    # silently bypass is worse than no hold.

  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
