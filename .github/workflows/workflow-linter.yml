# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Prevention workflow - validates all workflows have proper security config
name: Workflow Security Linter

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    paths:
      - '.github/workflows/**'

permissions: read-all

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check SPDX headers
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            # Scan the leading comment block, not line 1 only (REUSE allows the
            # identifier anywhere in that block). A line-1 test fights
            # `gh actions-lock`, which inserts its banner at line 1 whenever it
            # refreshes a lockfile, so every lock refresh re-failed this gate.
            # Mirrors standards governance-reusable.yml (2026-08-07 note).
            if ! awk '/^---[[:space:]]*$/ { next } /^#/ { print; next } { exit }' "$f" \
                 | grep -q "^# SPDX-License-Identifier:"; then
              echo "ERROR: $f missing SPDX header"
              errors=$((errors + 1))
            fi
          done
          exit $errors

      - name: Check permissions declaration
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! grep -q "^permissions:" "$f"; then
              echo "ERROR: $f missing permissions declaration"
              errors=$((errors + 1))
            fi
          done
          exit $errors

      - name: Check pinned actions
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            # Look for uses: without SHA
            if grep -E "uses:.*@v[0-9]" "$f" | grep -v "#"; then
              echo "WARNING: $f has unpinned actions (missing SHA comment)"
            fi
          done
