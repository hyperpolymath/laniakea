# SPDX-License-Identifier: MPL-2.0
name: Diag Lock (temporary)

on:
  push:
    branches: [arena/a119db60-laniakea]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without actions/checkout
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          git init -q .
          git remote add origin "https://github.com/${REPO}.git"
          git -c http.extraheader="${AUTH}" fetch -q --depth 1 origin "${SHA}"
          git checkout -q FETCH_HEAD

      - name: Install gh actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock

      - name: Verify (findings as annotations)
        run: |
          set -uo pipefail
          gh actions-lock --verify-local --json=valid,findings > /tmp/out.json 2>/tmp/err.txt || true
          echo "--- stderr ---"; cat /tmp/err.txt
          echo "--- json ---"; cat /tmp/out.json
          jq -r '.findings[]? | "::error::FINDING \(.category // "?") workflow=\(.workflow // "?") dep=\(.dependency // "?") sev=\(.severity // "?")"' /tmp/out.json || true
          jq -r '"::error::VALID=\(.valid)"' /tmp/out.json || echo "::error::NO JSON OUTPUT"
